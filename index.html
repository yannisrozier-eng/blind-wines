<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blind Wine</title>
<meta name="theme-color" content="#6f243d">
<meta name="description" content="Soirées de dégustation de vin interactives : à l’aveugle, découverte pédagogique et challenge.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Blind Wine">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="./config.js"></script>
<style>
:root{
  --bg:#f4f1ec;
  --surface:#ffffff;
  --surface-soft:#faf8f5;
  --ink:#1e1d1b;
  --muted:#77716b;
  --line:#e8e1da;
  --wine:#6f243d;
  --wine-dark:#51182d;
  --wine-soft:#f5e9ee;
  --sand:#d9c2a4;
  --sand-soft:#f3ece3;
  --green:#48685b;
  --shadow:0 18px 50px rgba(37,29,24,.07);
  --shadow-soft:0 8px 24px rgba(37,29,24,.05);
  --radius:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 0%, rgba(111,36,61,.055), transparent 34%),
    linear-gradient(180deg,#f8f6f2 0%,var(--bg) 100%);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  letter-spacing:-.01em;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.24) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px);
  background-size:36px 36px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.16),transparent 28%);
}
.app{
  width:min(1120px,100%);
  margin:auto;
  padding:24px 16px 72px;
}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:8px 2px 18px;
}
.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:14px;
  font-weight:900;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.logo span{color:var(--wine)}
.card{
  background:rgba(255,255,255,.92);
  border:1px solid rgba(232,225,218,.9);
  border-radius:var(--radius);
  padding:24px;
  box-shadow:var(--shadow-soft);
  margin-bottom:14px;
  backdrop-filter:blur(12px);
}
.hero{
  text-align:center;
  padding:52px 24px;
  box-shadow:var(--shadow);
  overflow:hidden;
  position:relative;
}
.hero:after{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  border-radius:50%;
  background:rgba(111,36,61,.045);
  top:-110px;
  right:-70px;
}
.emoji{font-size:52px;line-height:1}
h1{
  font-size:clamp(34px,6vw,58px);
  line-height:1.02;
  margin:14px 0 10px;
  letter-spacing:-.045em;
}
h2{
  font-size:23px;
  margin:0 0 8px;
  letter-spacing:-.03em;
}
h3{
  font-size:16px;
  margin:22px 0 10px;
}
p{line-height:1.55}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  appearance:none;
  border:0;
  border-radius:14px;
  padding:13px 18px;
  font-weight:800;
  font-size:14px;
  background:var(--wine);
  color:white;
  cursor:pointer;
  box-shadow:0 7px 18px rgba(111,36,61,.16);
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
}
.btn:hover{
  transform:translateY(-1px);
  background:var(--wine-dark);
  box-shadow:0 10px 24px rgba(111,36,61,.2);
}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.secondary{
  background:var(--surface-soft);
  color:var(--ink);
  border:1px solid var(--line);
  box-shadow:none;
}
.btn.secondary:hover{background:#f2eee9}
.btn.gold{
  background:#b89463;
  color:white;
  box-shadow:0 7px 18px rgba(184,148,99,.18);
}
.btn.green{background:var(--green)}
input,select{
  width:100%;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#fff;
  color:var(--ink);
  font:inherit;
  outline:none;
  transition:border-color .15s ease,box-shadow .15s ease;
}
input:focus,select:focus{
  border-color:#a56c81;
  box-shadow:0 0 0 4px rgba(111,36,61,.08);
}
select[multiple]{
  padding:8px;
  min-height:190px;
  background:var(--surface-soft);
}
select[multiple] option{
  padding:9px 10px;
  margin:2px 0;
  border-radius:8px;
}
label{
  display:block;
  font-size:12px;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.07em;
  margin:13px 0 6px;
  color:#5f5954;
}
.pill{
  display:inline-flex;
  align-items:center;
  padding:7px 11px;
  border-radius:999px;
  background:var(--wine-soft);
  color:var(--wine-dark);
  font-size:11px;
  font-weight:900;
  letter-spacing:.06em;
  text-transform:uppercase;
}
.code{
  font-size:38px;
  letter-spacing:.16em;
  font-weight:950;
  color:var(--wine);
  margin:8px 0 14px;
}
.notice,.success,.danger{
  padding:14px 16px;
  border-radius:15px;
  border:1px solid transparent;
}
.notice{
  background:var(--sand-soft);
  border-color:#e8dac8;
}
.success{
  background:#eaf2ee;
  border-color:#d7e7df;
}
.danger{
  background:#f6e7e5;
  border-color:#efd4d1;
}
.chips{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.chip{
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:9px 12px;
  cursor:pointer;
  font-size:13px;
  transition:.15s ease;
}
.chip:hover{border-color:#c4b6ac}
.chip.sel{
  background:var(--wine-soft);
  border-color:#c99bb0;
  color:var(--wine-dark);
}
.scale{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}
.scale.ten{grid-template-columns:repeat(10,1fr)}
.scale button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:12px;
  padding:11px 4px;
  cursor:pointer;
  font-weight:800;
  transition:.15s ease;
}
.scale button:hover{
  border-color:#bfa8b3;
  background:#fcf8fa;
}
.scale button.sel{
  background:var(--wine);
  border-color:var(--wine);
  color:#fff;
}
.wine-row{
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin-top:12px;
  background:linear-gradient(180deg,#fff,var(--surface-soft));
}
.wine-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.sticky{
  position:sticky;
  bottom:12px;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(14px);
  border:1px solid rgba(232,225,218,.9);
  box-shadow:0 12px 35px rgba(31,25,22,.1);
}
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  overflow:hidden;
}
th,td{
  padding:12px 10px;
  border-bottom:1px solid var(--line);
  text-align:left;
}
th{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.06em;
}
tr:last-child td{border-bottom:0}
.podium{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:14px;
}
.stat{
  padding:20px;
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(180deg,#fff,#fbf8f5);
  box-shadow:var(--shadow-soft);
}
.stat strong{
  display:block;
  font-size:28px;
  letter-spacing:-.035em;
  margin-top:4px;
}
.region-card{
  border:1px solid var(--line);
  border-radius:17px;
  padding:16px;
  background:linear-gradient(180deg,#fff,#faf7f4);
}
.region-card h4{margin:0 0 8px}
.region-card .grapes{
  font-size:13px;
  color:var(--muted);
  line-height:1.55;
}
.scorebox{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:12px;
}
.scoreitem{
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  background:#fff;
  text-align:center;
}
.scoreitem b{
  display:block;
  font-size:24px;
  margin-top:2px;
}
.recap{
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-top:12px;
  background:#fff;
}
.recap .truth{
  background:var(--surface-soft);
  border-radius:13px;
  padding:12px;
  margin-top:10px;
}
.center{text-align:center}
#qrcode canvas,#qrcode img{
  border-radius:16px;
  padding:10px;
  background:#fff;
  box-shadow:var(--shadow-soft);
}
@media(max-width:700px){
  .app{padding:16px 12px 56px}
  .card{padding:18px;border-radius:18px}
  .hero{padding:38px 18px}
  .podium,.scorebox{grid-template-columns:1fr}
  .scale.ten{grid-template-columns:repeat(5,1fr)}
  h1{font-size:38px}
  .code{font-size:32px}
  table{font-size:13px}
}

.config-simple{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.multi-select-box{
  background:var(--surface-soft);
  border:1px solid var(--line);
  border-radius:14px;
  padding:8px;
}
.multi-select-box select{
  border:0;
  box-shadow:none;
  background:transparent;
  min-height:170px;
}
.multi-select-box select:focus{box-shadow:none}
@media(max-width:700px){
  .config-simple{grid-template-columns:1fr}
}

.grape-picker{
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--surface-soft);
  overflow:hidden;
}
.grape-picker summary{
  list-style:none;
  cursor:pointer;
  padding:13px 14px;
  font-weight:800;
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.grape-picker summary::-webkit-details-marker{display:none}
.grape-picker-body{
  border-top:1px solid var(--line);
  max-height:320px;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  background:#fff;
}
.grape-option{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 14px;
  border-bottom:1px solid #f0ebe6;
  cursor:pointer;
}
.grape-option:last-child{border-bottom:0}
.grape-option input{
  width:22px;
  height:22px;
  margin:0;
  accent-color:var(--wine);
  flex:0 0 auto;
}
.grape-option span{
  font-size:15px;
  font-weight:650;
}
.player-chip{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 8px 7px 12px;
}
.player-chip .kick{
  border:0;
  background:#f5e8e8;
  color:#8b3434;
  width:28px;
  height:28px;
  border-radius:50%;
  cursor:pointer;
  font-weight:900;
}
.stats-bars{display:grid;gap:6px;margin-top:12px}
.stats-line{display:grid;grid-template-columns:24px 1fr 28px;gap:8px;align-items:center;font-size:12px}
.stats-track{height:9px;border-radius:999px;background:#eee8e1;overflow:hidden}
.stats-fill{height:100%;background:var(--wine);border-radius:999px}
.stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.stats-kpi{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.stats-kpi b{display:block;font-size:22px;margin-top:4px}
.install-hint{
  padding:12px 14px;
  border-radius:14px;
  background:var(--wine-soft);
  color:var(--wine-dark);
  font-size:13px;
  margin-top:12px;
}
@media(max-width:700px){
  .stats-grid{grid-template-columns:1fr}
}


.net-banner{position:fixed;z-index:1000;left:50%;transform:translateX(-50%);top:10px;padding:9px 14px;border-radius:999px;background:#8b3434;color:#fff;font-size:12px;font-weight:850;box-shadow:var(--shadow);display:none}
.net-banner.show{display:block}


.account-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.avatar{
 width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
 background:var(--wine-soft);color:var(--wine);font-weight:900;border:1px solid #ead5dd
}
.auth-shell{max-width:620px;margin:7vh auto}
.auth-mark{font-size:54px;margin-bottom:8px}
.history-list{display:grid;gap:12px}
.history-item{
 display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
 padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff
}
.history-item h3{margin:0 0 5px}
.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.metric-card{padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}
.metric-card strong{display:block;font-size:24px;margin-top:5px}
.profile-name{display:flex;align-items:center;gap:12px}
@media(max-width:700px){
 .metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .history-item{grid-template-columns:1fr}
}


/* V3.2 — reveal experience */
.reveal-stage{
 position:fixed;inset:0;z-index:1500;display:grid;place-items:center;
 min-height:100dvh;padding:24px;overflow:hidden;
 background:
   radial-gradient(circle at 50% 38%,rgba(111,36,61,.18),transparent 34%),
   linear-gradient(145deg,#1f1016,#471629 55%,#6f243d);
 color:#fff;text-align:center;
}
.reveal-stage::before,.reveal-stage::after{
 content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.22;
 background:#fff;animation:revealFloat 4s ease-in-out infinite alternate;
}
.reveal-stage::before{width:220px;height:220px;left:-70px;top:8%}
.reveal-stage::after{width:320px;height:320px;right:-130px;bottom:-60px;animation-delay:.5s}
.reveal-count{
 font-size:clamp(92px,28vw,220px);font-weight:950;line-height:.85;
 letter-spacing:-.06em;text-shadow:0 18px 50px rgba(0,0,0,.35);
 animation:revealPop .72s cubic-bezier(.2,.8,.2,1);
}
.reveal-kicker{font-weight:900;letter-spacing:.18em;text-transform:uppercase;opacity:.78}
.reveal-bottle-icon{font-size:86px;animation:revealPop .8s cubic-bezier(.2,.8,.2,1)}
.reveal-wine-name{font-size:clamp(34px,8vw,72px);line-height:1.02;margin:12px 0 6px;max-width:900px}
.reveal-price{font-size:clamp(34px,9vw,64px);font-weight:950;color:#f0d7a8;margin-top:10px}
.reveal-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.reveal-particles i{position:absolute;width:9px;height:9px;border-radius:50%;background:#f0d7a8;opacity:.75;animation:particleFall 2.8s linear infinite}
.reveal-particles i:nth-child(1){left:8%;animation-delay:.1s}.reveal-particles i:nth-child(2){left:18%;animation-delay:1.1s}
.reveal-particles i:nth-child(3){left:31%;animation-delay:.45s}.reveal-particles i:nth-child(4){left:44%;animation-delay:1.6s}
.reveal-particles i:nth-child(5){left:58%;animation-delay:.8s}.reveal-particles i:nth-child(6){left:69%;animation-delay:1.9s}
.reveal-particles i:nth-child(7){left:81%;animation-delay:.25s}.reveal-particles i:nth-child(8){left:92%;animation-delay:1.35s}
@keyframes revealPop{0%{transform:scale(.55);opacity:0}65%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes revealFloat{from{transform:translateY(-16px) scale(.95)}to{transform:translateY(20px) scale(1.05)}}
@keyframes particleFall{0%{transform:translateY(-8vh) rotate(0);opacity:0}15%{opacity:.8}100%{transform:translateY(108vh) rotate(240deg);opacity:0}}
.reveal-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}
.reveal-summary .stat{background:var(--surface-soft)}
.round-awards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.round-award{padding:15px;border:1px solid var(--line);border-radius:16px;background:var(--surface-soft)}
.round-award .award-icon{font-size:28px}.round-award strong{display:block;margin-top:5px}
.live-ranking{display:grid;gap:8px;margin-top:12px}
.live-rank-row{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.live-rank-row.me{border-color:#c99bb0;background:var(--wine-soft)}
.live-rank-pos{font-size:20px;font-weight:950;text-align:center}
.live-rank-score{font-weight:950;color:var(--wine)}
@media(max-width:700px){.reveal-summary,.round-awards{grid-template-columns:1fr}}


.mode-grid{grid-template-columns:repeat(3,minmax(0,1fr));margin:16px 0}
.mode-card{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;padding:18px;border:1px solid var(--border);border-radius:18px;background:var(--card);color:inherit}
.mode-card.selected{outline:3px solid rgba(255,255,255,.18);border-color:var(--accent)}
.mode-card small{color:var(--muted);line-height:1.4}.learning-card{padding:16px;border-left:4px solid var(--accent);background:rgba(255,255,255,.04);border-radius:14px;margin:14px 0}
@media(max-width:700px){.mode-grid{grid-template-columns:1fr}}

.discovery-progress{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0 20px}
.discovery-progress span{height:6px;border-radius:999px;background:rgba(255,255,255,.10)}
.discovery-progress span.on{background:var(--accent)}
.discovery-stage{animation:revealPop .25s ease both}
.discovery-stage h2{margin-top:8px}
.edu-tip{padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.05);margin:14px 0;line-height:1.5}
.edu-tip strong{display:block;margin-bottom:5px}
.quiz-options{display:grid;gap:10px;margin:16px 0}
.quiz-option{padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--card);color:inherit;text-align:left;font-weight:700;cursor:pointer}
.quiz-option.selected{border-color:var(--accent);outline:2px solid rgba(255,255,255,.12)}
.quiz-option.correct{outline:2px solid rgba(93,214,140,.55)}
.quiz-option.wrong{outline:2px solid rgba(255,100,100,.55)}
.discovery-nav{display:flex;gap:10px;margin-top:18px}
.discovery-nav .btn{flex:1}
.discovery-summary{display:grid;gap:10px}
.discovery-summary .row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--border)}
@media(max-width:700px){.discovery-nav{flex-direction:column-reverse}}

.global-home-btn{
 position:fixed;right:16px;bottom:18px;z-index:9999;
 display:none;align-items:center;gap:7px;
 border:1px solid rgba(255,255,255,.16);
 background:rgba(18,18,18,.92);color:#fff;
 padding:11px 14px;border-radius:999px;
 box-shadow:0 8px 28px rgba(0,0,0,.28);
 font:inherit;font-weight:700;cursor:pointer;
 backdrop-filter:blur(12px);
}
.global-home-btn.show{display:flex}
@media(max-width:560px){
 .global-home-btn{right:12px;bottom:12px;padding:10px 12px}
 .global-home-btn span{display:none}
}
.active-game-card{border:1px solid rgba(212,175,55,.45)}


.choice-search-wrap{
 display:flex;
 align-items:center;
 gap:8px;
 position:sticky;
 top:0;
 z-index:4;
 padding:10px;
 background:#fff;
 border-bottom:1px solid var(--line);
}
.choice-search{
 width:100%!important;
 min-height:44px;
 margin:0!important;
 padding:11px 13px!important;
 border:1px solid var(--line)!important;
 border-radius:11px!important;
 background:#fff!important;
 color:var(--ink)!important;
 font:inherit!important;
 -webkit-text-fill-color:var(--ink);
 caret-color:var(--wine);
 outline:none;
}
.choice-search::placeholder{
 color:#8d8580!important;
 opacity:1;
}
.choice-search:focus{
 border-color:#a56c81!important;
 box-shadow:0 0 0 4px rgba(111,36,61,.08)!important;
}
.choice-search::-webkit-search-cancel-button{
 -webkit-appearance:none;
 appearance:none;
}
.choice-search-clear{
 width:40px;
 height:40px;
 flex:0 0 40px;
 border:1px solid var(--line);
 border-radius:10px;

function regionObj(id){return REGION_CATALOG.find(r=>r.id===id)}
function regionAncestors(id){
 let out=[],cur=regionObj(id);
 while(cur){out.push(cur.id);cur=cur.parent?regionObj(cur.parent):null}
 return out;
}
function regionScore(guess,real){
 if(!guess||!real)return 0;
 if(guess===real)return 3;
 const ga=regionAncestors(guess),ra=regionAncestors(real);
 if(ga.includes(real)||ra.includes(guess)){
   const g=regionObj(guess),r=regionObj(real);
   if(["macro","country"].includes(g?.level)||["macro","country"].includes(r?.level))return 1;
   return 2;
 }
 const shared=ga.find(x=>ra.includes(x));
 if(shared){
   // Deux appellations/régions sœurs ne sont pas une relation parent/enfant :
   // elles gardent seulement le point de proximité géographique.
   return 1;
 }
 return 0;
}
function parseGrapes(v){
 if(Array.isArray(v))return v.filter(Boolean);
 const text=String(v||"").trim();
 if(!text)return [];
 // Compatibilité avec les anciennes V2.x qui stockaient un assemblage dans une chaîne
 // séparée par " / ", y compris lorsque le nom du cépage contient lui-même un slash.
 const memo=new Map();
 function walk(rest){
   if(memo.has(rest))return memo.get(rest);
   if(!rest){memo.set(rest,[]);return []}
   const exact=GRAPES.find(g=>g===rest);
   if(exact){const r=[exact];memo.set(rest,r);return r}
   for(const g of [...GRAPES].sort((a,b)=>b.length-a.length)){
     const prefix=g+" / ";
     if(rest.startsWith(prefix)){
       const tail=walk(rest.slice(prefix.length));
       if(tail){const r=[g,...tail];memo.set(rest,r);return r}
     }
   }
   memo.set(rest,null);return null;
 }
 return walk(text)||[text];
}
function canonicalGrape(g){
 const x=String(g||"").trim().toLowerCase();
 const aliases={
   "syrah / shiraz":"syrah","syrah":"syrah","shiraz":"syrah",
   "monastrell / mourvèdre":"mourvedre","mourvèdre":"mourvedre","monastrell":"mourvedre",
   "rolle / vermentino":"vermentino","rolle":"vermentino","vermentino":"vermentino"
 };
 return aliases[x]||x.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function grapeScore(guess,real){
 const g=[...new Set(parseGrapes(guess).map(canonicalGrape))];
 const r=[...new Set(parseGrapes(real).map(canonicalGrape))];
 if(!g.length||!r.length)return 0;
 const hits=g.filter(x=>r.includes(x)).length;
 const wrong=g.filter(x=>!r.includes(x)).length;
 if(!hits)return 0;
 if(hits===r.length && wrong===0)return 3;
 let base=Math.min(2,hits);
 if(r.length===1&&hits===1)base=3;
 return Math.max(0,base-Math.min(wrong,base));
}
function answerGrapes(a){
 return Array.isArray(a?.grapes)&&a.grapes.length?a.grapes:parseGrapes(a?.grape);
}
function priceScore(guess,real){
 guess=Number(guess);real=Number(real);
 if(!isFinite(guess)||!isFinite(real)||real<=0)return 0;
 const pct=Math.abs(guess-real)/real;
 if(pct<=.10)return 5;
 if(pct<=.20)return 4;
 if(pct<=.35)return 3;
 if(pct<=.50)return 2;
 if(pct<=.75)return 1;
 return 0;
}
function scoreParts(a,w,mode=game?.experience_mode||"blind"){
 const rawPrice=priceScore(a.price,w.price);
 const rawRegion=regionScore(a.region,w.region);
 const rawGrape=grapeScore(answerGrapes(a),w.grapes??w.grape);
 const factor=mode==="challenge"?challengeFactor(a):1;
 const eff=x=>Math.round(x*factor*100)/100;
 return {
   factor,
   rawPrice,rawRegion,rawGrape,
   price:eff(rawPrice),region:eff(rawRegion),grape:eff(rawGrape),
   total:eff(rawPrice+rawRegion+rawGrape)
 };
}
function knowledgeScore(a,w,mode=game?.experience_mode||"blind"){

   .replace(/œ/g,"oe")

   .replace(/\s+/g," ")

}

function filterChoiceOptions(input){

 let visibleCount=0;
 for(const el of options){
   const haystack=normalizeChoiceSearch(el.dataset.searchValue||el.textContent||"");
   const visible=!q||haystack.includes(q);
   el.hidden=!visible;
   el.classList.toggle("search-hidden",!visible);
   if(visible)visibleCount++;
 }

 if(empty)empty.hidden=visibleCount!==0;
}

   document.getElementById("app").innerHTML=`<div class="card hero"><h1>Configuration requise</h1><p>Ajoute ta Publishable Key Supabase dans <b>config.js</b>.</p></div>`;
   return;

 if(!window.supabase?.createClient){
   document.getElementById("app").innerHTML=`<div class="card hero"><h1>Chargement impossible</h1><p>Le SDK Supabase n’a pas pu être chargé. Vérifie ta connexion puis recharge la page.</p></div>`;

 supabaseClient=window.supabase.createClient(CONFIG.url,CONFIG.key);
 const {data,error}=await supabaseClient.auth.getSession();
 if(error)return toast(error.message);
 user=data.session?.user||null;

 supabaseClient.auth.onAuthStateChange((event,session)=>{
   const previousId=user?.id||null;
   user=session?.user||null;
   if(event==="SIGNED_OUT"){
     profile=null;game=null;role=null;player=null;wineCache=null;answerCache.clear();clearSession();
     return authScreen();
   }
   if((event==="SIGNED_IN"||event==="USER_UPDATED") && user && (previousId!==user.id||!profile)){
     setTimeout(()=>resumeAuthenticatedUser(),0);
   }
 });

 if(!user)return authScreen();
 await resumeAuthenticatedUser();
}

 await ensureProfile();
 if(!profile)return;
 if(!(await restoreSession()))home();
}
async function ensureProfile(){
 if(!user)return null;
 const r=await supabaseClient.from("profiles").select("*").eq("id",user.id).maybeSingle();
 if(r.error)return toast(r.error.message);
 if(!r.data){
   const fallback=(user.user_metadata?.display_name||user.email?.split("@")[0]||"Joueur").slice(0,30);
   const ins=await supabaseClient.from("profiles").upsert({id:user.id,display_name:fallback}).select().single();
   if(ins.error)return toast(ins.error.message);
   profile=ins.data;
 }else profile=r.data;
 return profile;
}

async function restoreSession(){

 try{saved=JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch{}
 if(!saved?.gameId)return false;

   .select("id,code,status,current,phase,wine_count,host_id,experience_mode,created_at")
   .eq("id",saved.gameId).maybeSingle();
 if(g.error||!g.data){clearSession();return false}
 game=g.data;wineCache=null;answerCache.clear();
 // Le rôle ne vient jamais de localStorage : l'identité serveur fait foi.
 role=game.host_id===user.id?"host":"player";

}

function subscribe(){
 if(channel)supabaseClient.removeChannel(channel);
 channel=supabaseClient.channel("game:"+game.id)
  .on("postgres_changes",{event:"*",schema:"public",table:"games",filter:"id=eq."+game.id},async()=>{const alive=await refreshGame();if(alive)requestRoute()})
  .on("postgres_changes",{event:"*",schema:"public",table:"players",filter:"game_id=eq."+game.id},()=>handlePlayersChange())
  .on("postgres_changes",{event:"*",schema:"public",table:"answers",filter:"game_id=eq."+game.id},payload=>handleAnswerRealtime(payload))
  .on("postgres_changes",{event:"*",schema:"public",table:"wine_reveals",filter:"game_id=eq."+game.id},async()=>{await refreshGame();requestRoute()})
  .subscribe();
}

async function handlePlayersChange(){
 if(role==="player"){
   const p=await supabaseClient.from("players").select("id,name").eq("game_id",game.id).eq("user_id",user.id).maybeSingle();
   if(!p.data){
     clearSession();
     home();
     return toast("L’organisateur t’a retiré de la partie.");
   }
   player={...player,...p.data};
 }
 requestRoute();
}


async function handleAnswerRealtime(payload){
 if(role!=="host"||game?.status!=="tasting"||game?.phase!=="answering")return;
 if(payload?.new?.done!==true&&payload?.old?.done!==true)return;
 requestRoute();
}
async function refreshGame(){
 if(!game)return false;
 const r=await supabaseClient.from("games").select("id,code,status,current,phase,wine_count,host_id,experience_mode,created_at").eq("id",game.id).maybeSingle();
 if(r.error){toast(r.error.message);return false}
 if(!r.data){
   clearSession();
   home();
   toast("Cette partie n’existe plus ou a été supprimée.");
   return false;
 }
 game=r.data;saveSession();return true;
}
let routePending=false;
function requestRoute(){
 if(document.body.dataset.screen!=="game")return;
 if(routePending)return;routePending=true;
 queueMicrotask(()=>{routePending=false;if(document.body.dataset.screen==="game")route()});
}
function route(){
 document.body.dataset.screen="game";
 updateGlobalHomeButton();
 routeSeq++;
 if(!game)return home();
 if(role==="host"){
   if(game.status==="lobby")return renderHostLobby();
   if(game.status==="tasting")return game.phase==="revealed"?(game.experience_mode==="discovery"?renderHostDiscoveryReveal():game.experience_mode==="challenge"?renderHostChallengeReveal():renderHostReveal()):renderHostTasting();
   return renderHostResults();
 }else{
   if(game.status==="lobby")return renderPlayerLobby();
   if(game.status==="tasting")return game.phase==="revealed"?(game.experience_mode==="discovery"?renderPlayerDiscoveryReveal():game.experience_mode==="challenge"?renderPlayerChallengeReveal():renderPlayerReveal()):renderPlayerTasting();
   return renderPlayerFinished();
 }
}

 </div></div>`).join("")}</div>

async function removePlayer(playerId){
 if(game.status!=="lobby")return toast("Tu peux retirer un joueur uniquement avant le lancement.");
 if(!confirm("Retirer ce joueur de la partie ?"))return;
 const r=await supabaseClient.from("players").delete().eq("id",playerId);
 if(r.error)toast(r.error.message);
 else renderHostLobby();
}

async function updateWineType(id,type){
 wineCache=null;
 const r=await supabaseClient.from("wines").update({type}).eq("id",id);
 if(r.error)toast(r.error.message);
}
async function updateWineSecret(wineId,key,val){
 const patch={[key]:val};
 const r=await supabaseClient.from("wine_secrets").update(patch).eq("wine_id",wineId);
 if(r.error)toast(r.error.message);
}

async function updateQuizOptions(wineId,text){
 const options=String(text||"").split(/\n+/).map(x=>x.trim()).filter(Boolean).slice(0,4);
 await updateWineSecret(wineId,"quiz_options",options);
}
async function updateWineGrapes(wineId,values){
 const r=await supabaseClient.from("wine_secrets").update({grapes:values}).eq("wine_id",wineId);
 if(r.error)toast(r.error.message);
}
async function startGame(){
 const ws=await getHostWines();
 const missing=ws.filter(w=>!w.name||!w.price||!w.region||!(w.grapes||[]).length);
 if(missing.length)return toast(`Complète les informations des vins : ${missing.map(w=>"#"+(w.position+1)).join(", ")}.`);
 if(game.experience_mode==="discovery"){
   const badQuiz=ws.filter(w=>{
     const q=String(w.quiz_question||"").trim();
     if(!q)return false;
     const opts=Array.isArray(w.quiz_options)?w.quiz_options:[];
     return opts.length<2||!Number.isInteger(w.quiz_correct)||w.quiz_correct<0||w.quiz_correct>=opts.length;
   });
   if(badQuiz.length)return toast(`Vérifie les mini-quiz des vins : ${badQuiz.map(w=>"#"+(w.position+1)).join(", ")}.`);
 }
 if(game.experience_mode==="challenge"){
   const badHints=ws.filter(w=>!String(w.hint1||"").trim()||!String(w.hint2||"").trim());
   if(badHints.length)return toast(`Ajoute les 2 indices des vins : ${badHints.map(w=>"#"+(w.position+1)).join(", ")}.`);
 }
 const r=await supabaseClient.rpc("start_game",{p_game_id:game.id});
 if(r.error)toast(r.error.message);
}
async function renderPlayerLobby(){
 const ps=await getPlayers();
 document.getElementById("app").innerHTML=`<div class="card hero"><div class=emoji>${modeInfo().icon}</div><span class=pill>PARTIE ${esc(game.code)} · ${modeBadge()}</span><h1>Salut ${esc(player.name)} !</h1><p>Tu es connecté.</p>
 <div class=notice>En attente du lancement de la dégustation…</div><h3>Joueurs</h3><div class=chips>${ps.filter(p=>p.user_id!==game.host_id).map(p=>`<span class=chip>👤 ${esc(p.name)}</span>`).join("")}</div></div>`;
}
async function getAnswer(wineId,force=false){
 const key=`${game.id}:${wineId}:${user.id}`;
 if(!force&&answerCache.has(key))return answerCache.get(key);
 const r=await supabaseClient.from("answers").select("*").eq("game_id",game.id).eq("wine_id",wineId).eq("user_id",user.id).maybeSingle();
 if(r.error)toast(r.error.message);
 const value=r.data||{game_id:game.id,wine_id:wineId,user_id:user.id,scores:{},aromas:[],note:null,price:null,region:"",grapes:[],grape:"",hint_level:0,discovery_step:0,quiz_choice:null,done:false};
 answerCache.set(key,value);return value;
}

async function getDiscoveryWine(wineId){
 if(game.experience_mode!=="discovery")return null;

 return r.error?null:(Array.isArray(r.data)?r.data[0]:r.data);
}
async function getDiscoveryQuizFeedback(wineId){
 if(game.experience_mode!=="discovery")return null;
 const r=await supabaseClient.rpc("get_discovery_quiz_feedback",{p_game_id:game.id,p_wine_id:wineId});
 return r.error?null:(Array.isArray(r.data)?r.data[0]:r.data);
}
async function getChallengeHints(wineId){
 if(game.experience_mode!=="challenge")return {};
 const r=await supabaseClient.rpc("get_challenge_hints",{p_game_id:game.id,p_wine_id:wineId});

async function revealHint(wineId,level){const a=await getAnswer(wineId);if(a.done)return;await upsertAnswer(wineId,{hint_level:Math.max(a.hint_level||0,level)});renderPlayerTasting()}
function challengeFactor(a){return a.hint_level===1?.75:a.hint_level===2?.5:1}

function discoveryDefaults(d){
 const grapes=(d?.grapes||[]).join(" / ");
 const identity=[regionLabel(d?.region),grapes].filter(Boolean).join(" · ");
 const customQuestion=String(d?.quiz_question||"").trim();
 const customOptions=Array.isArray(d?.quiz_options)?d.quiz_options:[];
 const hasCustomQuiz=customQuestion!==""&&customOptions.length>=2;
 const customCorrect=Number.isInteger(d?.quiz_correct)&&d.quiz_correct>=0&&d.quiz_correct<customOptions.length?d.quiz_correct:0;
 return {
   eye_tip:d?.eye_tip||"Observe d’abord la robe sans chercher à identifier le vin : intensité, limpidité et nuances donnent des indices sur son style et son évolution.",
   nose_tip:d?.nose_tip||"Commence par les grandes familles d’arômes. Il est plus utile d’identifier « agrumes » ou « fruits rouges » que de chercher immédiatement un arôme très précis.",
   palate_tip:d?.palate_tip||"En bouche, sépare les sensations : acidité, douceur, corps et longueur. Cette structure est souvent plus fiable que les arômes seuls.",
   question:hasCustomQuiz?customQuestion:"Quel est le meilleur réflexe pour progresser en dégustation ?",
   options:hasCustomQuiz?customOptions:["Mettre des mots sur ses sensations","Trouver absolument le domaine","Se fier uniquement au prix"],
   correct:hasCustomQuiz?customCorrect:0,
   explanation:hasCustomQuiz?(String(d?.quiz_explanation||"").trim()||"Observe la structure du vin et relie-la progressivement à son style."):"La progression vient surtout de la capacité à décrire ce que l’on ressent, puis à relier ces sensations au style du vin.",
   identity
 };
}
function discoveryProgress(step){return `<div class=discovery-progress>${[0,1,2,3,4].map(i=>`<span class="${i<=step?"on":""}"></span>`).join("")}</div>`}
async function setDiscoveryStep(wineId,step){
 await upsertAnswer(wineId,{discovery_step:Math.max(0,Math.min(4,step))});
 renderPlayerTasting();
}
async function chooseDiscoveryQuiz(wineId,index){
 const a=await getAnswer(wineId);
 if(Number.isInteger(a.quiz_choice))return toast("Ta première réponse au mini-quiz est déjà verrouillée.");
 await upsertAnswer(wineId,{quiz_choice:index});
 renderPlayerTasting();
}
function sensoryLabel(v){return v?`${v}/5`:"—"}
function renderDiscoveryJourney(w,a,d,feedback=null){
 const step=Math.max(0,Math.min(4,Number(a.discovery_step||0)));
 const e=discoveryDefaults(d);
 if(feedback){
   e.correct=Number.isInteger(feedback.quiz_correct)?feedback.quiz_correct:0;
   e.explanation=feedback.quiz_explanation||e.explanation;
 }
 const title=`${esc(d?.name||TYPES[w.type])}`;
 const identity=`${esc(regionLabel(d?.region)||"")} ${d?.grapes?.length?"· "+esc(d.grapes.join(" / ")):""} ${d?.price?`· ${Number(d.price).toFixed(2)} €`:""}`;
 let body="";
 if(step===0){
   body=`<div class=discovery-stage><div class=emoji>🎓</div><h2>${title}</h2><p class=muted>${identity}</p>
   ${d?.learning_goal?`<div class=learning-card><b>Objectif de ce verre</b><div>${esc(d.learning_goal)}</div></div>`:""}
   <div class=edu-tip><strong>Comment ça marche ?</strong>Tu vas avancer en 4 temps : observer, sentir, goûter puis comprendre. Il n’y a pas de “mauvaise” sensation : le but est d’apprendre à décrire ce que tu perçois.</div>
   <div class=discovery-nav><button class=btn onclick="setDiscoveryStep('${w.id}',1)">Commencer par l’œil →</button></div></div>`;
 }
 if(step===1){
   body=`<div class=discovery-stage><div class=emoji>👁️</div><h2>1. Observe</h2><p class=muted>Regarde le vin avant de le sentir.</p>
   ${metric("Intensité visuelle","look",a)}
   <div class=edu-tip><strong>💡 Repère</strong>${esc(e.eye_tip)}</div>
   <div class=discovery-nav><button class="btn secondary" onclick="setDiscoveryStep('${w.id}',0)">← Retour</button><button class=btn onclick="setDiscoveryStep('${w.id}',2)">Passer au nez →</button></div></div>`;
 }
 if(step===2){
   body=`<div class=discovery-stage><div class=emoji>👃</div><h2>2. Sens</h2><p class=muted>Choisis les familles d’arômes qui te parlent le plus.</p>
   ${metric("Intensité aromatique","nose",a)}
   <div class=section><h3>Arômes perçus</h3><div class=chips>${AROMAS[w.type].map(x=>`<button class="chip ${(a.aromas||[]).includes(x)?"sel":""}" onclick="toggleAroma('${w.id}',decodeURIComponent('${encodeURIComponent(x)}'))">${esc(x)}</button>`).join("")}</div></div>
   <div class=edu-tip><strong>💡 Repère</strong>${esc(e.nose_tip)}</div>
   <div class=discovery-nav><button class="btn secondary" onclick="setDiscoveryStep('${w.id}',1)">← L’œil</button><button class=btn onclick="setDiscoveryStep('${w.id}',3)">Passer à la bouche →</button></div></div>`;
 }
 if(step===3){
   body=`<div class=discovery-stage><div class=emoji>👄</div><h2>3. Goûte</h2><p class=muted>Concentre-toi sur la structure du vin.</p>
   ${metric("🍋 Acidité","acid",a)}${metric("🍯 Douceur / sucrosité","sweet",a)}${metric("💪 Corps / puissance","body",a)}${metric("⏱️ Persistance","finish",a)}
   <div class=section><h3>❤️ Ton plaisir</h3><div class="scale ten">${Array.from({length:10},(_,i)=>i+1).map(n=>`<button class="${a.note===n?"sel":""}" onclick="setAnswer('${w.id}','note',${n})">${n}</button>`).join("")}</div></div>
   <div class=edu-tip><strong>💡 Repère</strong>${esc(e.palate_tip)}</div>
   <div class=discovery-nav><button class="btn secondary" onclick="setDiscoveryStep('${w.id}',2)">← Le nez</button><button class=btn onclick="setDiscoveryStep('${w.id}',4)">Comprendre →</button></div></div>`;
 }
 if(step===4){
   const choice=Number.isInteger(a.quiz_choice)?a.quiz_choice:null;
   const answered=choice!==null;
   const correct=answered&&choice===e.correct;
   body=`<div class=discovery-stage><div class=emoji>🧠</div><h2>4. Comprendre</h2>
   <div class=learning-card><b>Mini-quiz</b><div style="margin-top:8px">${esc(e.question)}</div></div>
   <div class=quiz-options>${e.options.slice(0,4).map((opt,i)=>`<button class="quiz-option ${choice===i?"selected":""} ${answered&&i===e.correct?"correct":""} ${answered&&choice===i&&i!==e.correct?"wrong":""}" ${answered?"disabled":""} onclick="chooseDiscoveryQuiz('${w.id}',${i})">${String.fromCharCode(65+i)}. ${esc(opt)}</button>`).join("")}</div>
   ${answered?`<div class=edu-tip><strong>${correct?"✅ Bien vu !":"💡 À retenir"}</strong>${esc(e.explanation)}</div>`:`<p class=muted>Choisis une réponse pour afficher l’explication.</p>`}
   ${d?.learning_note?`<div class=learning-card><b>La leçon de ce verre</b><div>${esc(d.learning_note)}</div></div>`:""}
   <div class=discovery-summary>
    <div class=row><span>👁️ Intensité visuelle</span><b>${sensoryLabel(a.scores?.look)}</b></div>

    <div class=row><span>🍋 Acidité</span><b>${sensoryLabel(a.scores?.acid)}</b></div>
    <div class=row><span>💪 Corps</span><b>${sensoryLabel(a.scores?.body)}</b></div>
    <div class=row><span>❤️ Plaisir</span><b>${a.note?`${a.note}/10`:"—"}</b></div>
   </div>
   <div class=discovery-nav><button class="btn secondary" onclick="setDiscoveryStep('${w.id}',3)">← La bouche</button><button class=btn ${(!a.note||!answered)?"disabled":""} onclick="submitAnswer('${w.id}')">Terminer ce verre</button></div>
   ${!a.note?`<p class=muted>Ajoute ta note de plaisir avant de terminer.</p>`:""}${!answered?`<p class=muted>Réponds au mini-quiz avant de terminer.</p>`:""}
   </div>`;
 }
 return `<div class=card><span class=pill>VIN ${game.current+1} · 🎓 Découverte</span>${discoveryProgress(step)}${body}</div>${guideHtml()}`;
}

async function renderPlayerTasting(){
 const ws=await getBlindWines(),w=ws[game.current];
 if(!w)return toast("Vin introuvable.");
 const a=await getAnswer(w.id);

 if(a.done){
   const waitTitle=game.experience_mode==="discovery"?"Étape enregistrée":game.experience_mode==="challenge"?"Pronostic verrouillé":"Réponse enregistrée";
   const waitIcon=game.experience_mode==="discovery"?"🎓":game.experience_mode==="challenge"?"🥂":"✅";
   document.getElementById("app").innerHTML=`<header><div class=logo>🍷 <span>BLIND WINE</span></div><span class=pill>VIN ${game.current+1}/${game.wine_count||ws.length}</span></header>
   <div class="card hero"><div class=emoji>${waitIcon}</div><h1>${waitTitle}</h1><p class=muted>Attends que l'organisateur révèle le vin.</p><div class=notice>Cette réponse est verrouillée pour ce vin.</div></div>`;
   return;
 }

 if(game.experience_mode==="discovery"){
   const discovery=await getDiscoveryWine(w.id);
   const feedback=Number.isInteger(a.quiz_choice)?await getDiscoveryQuizFeedback(w.id):null;
   document.getElementById("app").innerHTML=`<header><div class=logo>🍷 <span>BLIND WINE</span></div><span class=pill>${esc(player.name)}</span></header>${renderDiscoveryJourney(w,a,discovery,feedback)}`;
   return;
 }

 if(game.experience_mode==="challenge")return renderPlayerChallengeTasting(w,a,ws);
 return renderPlayerBlindTasting(w,a,ws);
}

 <div class=section><h3>❤️ Ta note globale</h3><div class="scale ten">${Array.from({length:10},(_,i)=>i+1).map(n=>`<button class="${a.note===n?"sel":""}" onclick="setAnswer('${w.id}','note',${n})">${n}</button>`).join("")}</div></div>

function metric(label,key,a){
 return `<div class=section><h3>${label}</h3><div class=scale>${[1,2,3,4,5].map(n=>`<button class="${a.scores?.[key]===n?"sel":""}" onclick="setScore('${a.wine_id||""}','${key}',${n})">${n}</button>`).join("")}</div></div>`;

async function setScore(wineId,key,n){
 const a=await getAnswer(wineId),scores={...(a.scores||{}),[key]:n};
 await upsertAnswer(wineId,{scores});
}
async function setAnswer(wineId,key,val){await upsertAnswer(wineId,{[key]:val})}
async function toggleAroma(wineId,x){
 const a=await getAnswer(wineId),ar=a.aromas||[];
 await upsertAnswer(wineId,{aromas:ar.includes(x)?ar.filter(v=>v!==x):[...ar,x]});
}
async function setPlayerGrapes(wineId,values){await upsertAnswer(wineId,{grapes:values})}
async function upsertAnswer(wineId,patch){
 const a=await getAnswer(wineId);
 if(a.done)return toast("Réponse déjà validée.");
 const payload={...a,...patch};delete payload.id;delete payload.created_at;

function tiedNames(items,scoreFn,{requirePositive=false}={}){
 if(!items.length)return "—";
 const scored=items.map(x=>({x,v:Number(scoreFn(x))})).filter(y=>Number.isFinite(y.v));
 if(!scored.length)return "—";
 const best=Math.max(...scored.map(y=>y.v));
 if(requirePositive&&best<=0)return "Personne";
 return scored.filter(y=>y.v===best).map(y=>y.x.playerName||"Joueur").join(" & ");
}
function closestPriceNames(items,realPrice){
 if(!items.length)return "—";
 const scored=items.map(x=>({x,v:Math.abs(Number(x.price)-Number(realPrice))})).filter(y=>Number.isFinite(y.v));
 if(!scored.length)return "—";
 const best=Math.min(...scored.map(y=>y.v));
 return scored.filter(y=>Math.abs(y.v-best)<1e-9).map(y=>y.x.playerName||"Joueur").join(" & ");
}
async function getRevealDashboardData(rv){
 const [playersR,answersR,revealsR]=await Promise.all([
   supabaseClient.from("players").select("user_id,name").eq("game_id",game.id).order("created_at"),
   supabaseClient.from("answers").select("user_id,wine_id,note,price,region,grapes,grape,hint_level,done").eq("game_id",game.id).eq("done",true),
   supabaseClient.from("wine_reveals").select("wine_id,game_id,name,price,region,grapes,learning_note,revealed_at").eq("game_id",game.id)
 ]);
 const err=playersR.error||answersR.error||revealsR.error;
 if(err){toast(err.message);return {rows:[],current:[],awards:{},group:{}}}
 const players=(playersR.data||[]).filter(p=>p.user_id!==game.host_id);
 const playerById=new Map(players.map(p=>[p.user_id,p]));
 const reveals=revealsR.data||[];
 const revealByWine=new Map(reveals.map(r=>[r.wine_id,r]));
 const answers=(answersR.data||[]).map(a=>({...a,playerName:playerById.get(a.user_id)?.name||"Joueur"}));
 const answersByUser=new Map(),answersByWine=new Map();
 for(const a of answers){
   if(!answersByUser.has(a.user_id))answersByUser.set(a.user_id,[]);
   answersByUser.get(a.user_id).push(a);
   if(!answersByWine.has(a.wine_id))answersByWine.set(a.wine_id,[]);
   answersByWine.get(a.wine_id).push(a);
 }
 const rows=players.map(p=>{
   const mine=(answersByUser.get(p.user_id)||[]).filter(a=>revealByWine.has(a.wine_id));
   const score=mine.reduce((sum,a)=>sum+knowledgeScore(a,revealByWine.get(a.wine_id)),0);
   return {user_id:p.user_id,name:p.name,score,count:mine.length};
 }).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,"fr"));
 let lastScore=null,lastRank=0;
 rows.forEach((row,i)=>{if(row.score!==lastScore){lastRank=i+1;lastScore=row.score}row.rank=lastRank});
 const current=answersByWine.get(rv.wine_id)||[];
 const avgPrice=current.length?current.reduce((s,a)=>s+Number(a.price||0),0)/current.length:0;
 const avgNote=current.length?current.reduce((s,a)=>s+Number(a.note||0),0)/current.length:0;
 const awards={
   top:tiedNames(current,a=>knowledgeScore(a,rv),{requirePositive:true}),
   price:closestPriceNames(current,rv.price),
   region:tiedNames(current,a=>regionScore(a.region,rv.region),{requirePositive:true}),
   grape:tiedNames(current,a=>grapeScore(answerGrapes(a),rv.grapes),{requirePositive:true}),
   heart:tiedNames(current,a=>Number(a.note||0),{requirePositive:true})
 };
 return {rows,current,awards,group:{avgPrice,avgNote,count:current.length}};
}

 ]);

 const playerById=new Map(ps.map(p=>[p.user_id,p]));
 const revealByWine=new Map(reveals.map(r=>[r.wine_id,r]));
 const allAnswers=(aa.data||[]).map(a=>({...a,playerName:playerById.get(a.user_id)?.name||"Joueur"}));
 const answersByUser=new Map(),answersByWine=new Map();
 for(const a of allAnswers){

 if(game.experience_mode==="discovery"){

     <div class=stat><span>💡 Indices moyens du groupe</span><strong>${groupHints.toFixed(1)}</strong><span class=muted>par réponse</span></div>
   </div></div>
   <div class=card><h2>Classement complet</h2><table><tr><th>#</th><th>Joueur</th><th>Final</th><th>Brut</th><th>Indices</th><th>Efficacité</th></tr>${rows.map(r=>`<tr><td>${r.rank}</td><td>${esc(r.name)}</td><td><b>${r.adjusted}</b></td><td>${r.raw}</td><td>${r.hints}</td><td>${Math.round(r.efficiency*100)}%</td></tr>`).join("")}</table></div>
   <div class=card><button class="btn secondary" onclick="renderHostStats()">📊 Statistiques Challenge</button> <button class="btn secondary" onclick="renderProfile()">📚 Historique</button> <button class="btn secondary" onclick="home()">Accueil</button></div>`;

 rows.sort((a,b)=>b.score-a.score||a.priceDelta-b.priceDelta||a.name.localeCompare(b.name,"fr"));
 let prevScore=null,competitionRank=0;
 rows.forEach((row,i)=>{if(row.score!==prevScore){competitionRank=i+1;prevScore=row.score}row.rank=competitionRank});
 const tiedRowNames=(key)=>{
   if(!rows.length)return "—";
   const best=Math.max(...rows.map(r=>Number(r[key]||0)));
   return rows.filter(r=>Number(r[key]||0)===best).map(r=>r.name).join(" & ");
 };
 const bestSommelier=tiedRowNames("score");
 const bestPrice=tiedRowNames("pricePts");
 const bestGrape=tiedRowNames("grapePts");
 const bestRegion=tiedRowNames("regionPts");
 const wineStats=ws.map(w=>{
   const list=answersByWine.get(w.id)||[],rv=revealByWine.get(w.id);
   return {w,rv,avg:list.length?list.reduce((s,a)=>s+Number(a.note||0),0)/list.length:0,count:list.length};
 }).filter(x=>x.rv&&x.count).sort((a,b)=>b.avg-a.avg);
 const favorite=wineStats[0];
 const tasteRows=ps.map(p=>{
   const deviations=[];
   for(const w of ws){
     const list=answersByWine.get(w.id)||[];if(!list.length)continue;
     const avg=list.reduce((s,a)=>s+Number(a.note||0),0)/list.length,pa=list.find(a=>a.user_id===p.user_id);
     if(pa)deviations.push(Math.abs(Number(pa.note||0)-avg));
   }
   return {name:p.name,dev:deviations.length?deviations.reduce((s,x)=>s+x,0)/deviations.length:Infinity};
 }).sort((a,b)=>a.dev-b.dev);
 const finiteTaste=tasteRows.filter(x=>isFinite(x.dev));
 const bestTasteDev=finiteTaste.length?finiteTaste[0].dev:null;
 const bestTaste=bestTasteDev==null?"—":finiteTaste.filter(x=>Math.abs(x.dev-bestTasteDev)<1e-9).map(x=>x.name).join(" & ");
 document.getElementById("app").innerHTML=`<header><div class=logo>🍷 <span>BLIND WINE</span></div><span class=pill>FINAL</span></header>
 <div class="card hero"><div class=emoji>🏆</div><h1>Classement final</h1><p class=muted>Prix + région + cépages.</p></div>
 <div class=podium>${rows.filter(x=>x.rank<=3).map(x=>`<div class=stat center><div class=emoji>${x.rank===1?"🥇":x.rank===2?"🥈":"🥉"}</div><h2>${esc(x.name)}</h2><strong>${x.score} pts</strong><span class=muted>${x.count}/${game.wine_count} vins</span></div>`).join("")}</div>
 <div class=card><h2>🎖️ Badges de la soirée</h2><div class=grid>
  <div class=stat><span>🧠 Meilleur sommelier</span><strong>${esc(bestSommelier)}</strong><span class=muted>${rows.length?Math.max(...rows.map(r=>r.score)):0} pts</span></div>
  <div class=stat><span>💰 Meilleur estimateur</span><strong>${esc(bestPrice)}</strong><span class=muted>${rows.length?Math.max(...rows.map(r=>r.pricePts)):0} pts prix</span></div>
  <div class=stat><span>🍇 Expert cépages</span><strong>${esc(bestGrape)}</strong><span class=muted>${rows.length?Math.max(...rows.map(r=>r.grapePts)):0} pts cépages</span></div>
  <div class=stat><span>🗺️ Expert régions</span><strong>${esc(bestRegion)}</strong><span class=muted>${rows.length?Math.max(...rows.map(r=>r.regionPts)):0} pts régions</span></div>
  <div class=stat><span>❤️ Meilleur goût du groupe</span><strong>${esc(bestTaste)}</strong><span class=muted>Notes les plus proches du groupe</span></div>
 </div></div>
 <div class=card><h2>❤️ Favori de la soirée</h2>${favorite?`<div class=wine-row><div class=wine-head><b>${ICON[favorite.w.type]} ${esc(favorite.rv.name)}</b><span class=pill>${favorite.avg.toFixed(1)}/10</span></div><p>${esc(regionLabel(favorite.rv.region))} · ${esc((favorite.rv.grapes||[]).join(" / "))} · ${Number(favorite.rv.price).toFixed(2)} €</p></div>`:"<p class=muted>Aucune note.</p>"}</div>
 <div class=card><button class="btn secondary" onclick="renderHostStats()">📊 Voir les statistiques par bouteille</button></div>
 <div class=card><button class="btn secondary" onclick="renderProfile()">📚 Mon historique</button> <button class="btn secondary" onclick="home()">Accueil</button></div>
 <div class=card><h2>Classement dégustateurs</h2><table><tr><th>#</th><th>Joueur</th><th>Total</th><th>Prix</th><th>Région</th><th>Cépages</th></tr>${rows.map(x=>`<tr><td>${x.rank}</td><td>${esc(x.name)}</td><td><b>${x.score}</b></td><td>${x.pricePts}</td><td>${x.regionPts}</td><td>${x.grapePts}</td></tr>`).join("")}</table></div>`;
}
async function renderHostStats(){
 const [ws,rr,ar]=await Promise.all([
   getBlindWines(),
   supabaseClient.from("wine_reveals").select("*").eq("game_id",game.id),
   supabaseClient.from("answers").select("*").eq("game_id",game.id).eq("done",true)
 ]);
 const err=rr.error||ar.error;if(err)return toast(err.message);
 const reveals=rr.data||[],answers=ar.data||[];
 const revealByWine=new Map(reveals.map(r=>[r.wine_id,r]));
 const answersByWine=new Map();
 for(const a of answers){if(!answersByWine.has(a.wine_id))answersByWine.set(a.wine_id,[]);answersByWine.get(a.wine_id).push(a)}
 const cards=ws.map((w,i)=>{
   const rv=revealByWine.get(w.id),aa=answersByWine.get(w.id)||[];
   if(!rv)return "";
   const avgPrice=game.experience_mode!=="discovery"&&aa.length?aa.reduce((s,a)=>s+Number(a.price||0),0)/aa.length:0;
   const avgNote=aa.length?aa.reduce((s,a)=>s+Number(a.note||0),0)/aa.length:0;
   const avgErr=game.experience_mode!=="discovery"&&aa.length?aa.reduce((s,a)=>s+Math.abs(Number(a.price||0)-Number(rv.price||0)),0)/aa.length:0;
   const avgHints=game.experience_mode==="challenge"&&aa.length?aa.reduce((s,a)=>s+Number(a.hint_level||0),0)/aa.length:0;
   const avgChallenge=game.experience_mode==="challenge"&&aa.length?aa.reduce((s,a)=>s+scoreParts(a,rv,"challenge").total,0)/aa.length:0;
   const quizAnswered=game.experience_mode==="discovery"?aa.filter(a=>Number.isInteger(a.quiz_choice)):[];
   const quizCorrect=game.experience_mode==="discovery"&&quizAnswered.length?quizAnswered.filter(a=>Number(a.quiz_choice)===discoveryDefaults(rv).correct).length:0;
   const dist=Array.from({length:10},(_,idx)=>aa.filter(a=>Number(a.note)===idx+1).length);
   const max=Math.max(1,...dist);
   return `<div class=card><div class=wine-head><div><span class=pill>VIN ${i+1}</span><h2 style="margin-top:8px">${ICON[w.type]} ${esc(rv.name)}</h2><p class=muted>${esc(regionLabel(rv.region))} · ${esc((rv.grapes||[]).join(" / "))}</p></div><b>${Number(rv.price).toFixed(2)} €</b></div>
   <div class=stats-grid>
    ${game.experience_mode!=="discovery"?`<div class=stats-kpi><span>Prix estimé moyen</span><b>${avgPrice.toFixed(2)} €</b></div><div class=stats-kpi><span>Écart moyen au vrai prix</span><b>${avgErr.toFixed(2)} €</b></div>`:""}
    ${game.experience_mode==="challenge"?`<div class=stats-kpi><span>Indices moyens</span><b>${avgHints.toFixed(1)}</b></div><div class=stats-kpi><span>Score Challenge moyen</span><b>${avgChallenge.toFixed(2)}/11</b></div>`:""}
    ${game.experience_mode==="discovery"?`<div class=stats-kpi><span>Mini-quiz</span><b>${quizAnswered.length?Math.round(quizCorrect/quizAnswered.length*100):0}%</b></div>`:""}
    <div class=stats-kpi><span>Note plaisir moyenne</span><b>${avgNote.toFixed(1)}/10</b></div>
   </div>
   <h3>Distribution des notes</h3><div class=stats-bars>${dist.map((n,idx)=>`<div class=stats-line><span>${idx+1}</span><div class=stats-track><div class=stats-fill style="width:${(n/max)*100}%"></div></div><b>${n}</b></div>`).join("")}</div>
   <p class="small muted">${aa.length} réponse${aa.length>1?"s":""}</p></div>`;
 }).join("");
 document.getElementById("app").innerHTML=`<header><div class=logo>🍷 <span>BLIND WINE</span></div><span class=pill>STATISTIQUES</span></header>
 <div class="card hero"><div class=emoji>📊</div><h1>${game.experience_mode==="discovery"?"Statistiques pédagogiques":game.experience_mode==="challenge"?"Statistiques Challenge":"Statistiques à l’aveugle"}</h1><p class=muted>${game.experience_mode==="discovery"?"Notes de plaisir et progression collective.":game.experience_mode==="challenge"?"Précision, prise de risque et résultats bouteille par bouteille.":"Prix estimés, écarts et notes bouteille par bouteille."}</p><button class="btn secondary" onclick="renderHostResults()">← Retour aux résultats</button></div>
 ${cards||"<div class=card><p class=muted>Aucune statistique disponible.</p></div>"}`;
}

 const b=document.getElementById("netBanner");
 if(b)b.classList.toggle("show",!navigator.onLine);
}

 window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
